name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv run python scripts/export_static_model.py --check
      - run: uv run pip-audit
      - name: Smoke-test static demo
        run: |
          python -m http.server 8000 --directory docs/demo &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --fail --retry 5 --retry-connrefused http://127.0.0.1:8000/ > /dev/null
